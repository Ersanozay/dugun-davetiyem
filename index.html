<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabriye &amp; Ersan | Düğün Davetiyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ======================================================
     CONFIG: sadece script.js dosyasının en üstündeki CONFIG
     nesnesini (script.js) ve videoyu ("intro-video.mp4") değiştirerek
     tüm davetiyeyi kendine uyarlayabilirsin.
     ====================================================== -->

<!-- HERO — dokunarak aç: geçiş bir kez oynar, sonra yürüyüş sahnesi
     sonsuz döngüde kalır. Metinler tam yürüyüş başlarken belirir. -->
<section class="hero">
  <video class="hero__video" id="introClip" src="assets/videos/intro-clip.mp4" poster="assets/images/hero-poster.jpg" muted playsinline preload="auto"></video>
  <video class="hero__video hero__video--loop" id="loopClip" src="assets/videos/loop-clip.mp4" muted loop playsinline preload="auto"></video>
  <audio id="bgMusic" src="assets/audio/song.mp3" loop preload="auto"></audio>
  <div class="hero__scrim"></div>

  <button type="button" class="hero__sound" id="soundBtn" aria-pressed="true" aria-label="Sesi kapat" hidden>🔊</button>

  <div class="hero__content" id="heroContent">
    <p class="hero__label hero-fade" data-cfg="heroLabel"></p>
    <h1 class="hero__script hero-fade" id="heroScript"></h1>

    <div class="hero__date hero-fade">
      <div class="hero__date-grid">
        <div class="hero__date-side">
          <span class="hero__date-line"></span>
          <span class="hero__date-month" id="heroMonth">—</span>
          <span class="hero__date-line"></span>
        </div>
        <span class="hero__date-day" id="heroDay">--</span>
        <div class="hero__date-side">
          <span class="hero__date-line"></span>
          <span class="hero__date-year" id="heroYear">----</span>
          <span class="hero__date-line"></span>
        </div>
      </div>
      <div class="hero__date-weekday" id="heroWeekday">—</div>
    </div>

    <div class="hero__scrolldown hero-fade">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p>Aşağı kaydırınız.</p>
    </div>
  </div>

  <button type="button" class="hero__gate" id="gateBtn" aria-label="Davetiyeyi aç">
    <span class="hero__gate-ring">▶</span>
    <span class="hero__gate-text">Açmak için dokunun</span>
  </button>
</section>

<div class="scallop" style="--target:var(--sand)"></div>

<!-- COUNTDOWN -->
<section class="countdown">
  <img class="countdown__deco countdown__deco--left" src="assets/images/en-ozel-gun-sol.png" alt="" aria-hidden="true">
  <img class="countdown__deco countdown__deco--right" src="assets/images/en-ozel-gun-sag.png" alt="" aria-hidden="true">
  <div class="wrap">
    <div class="section-head reveal">
      <p class="eyebrow">Geri Sayım</p>
      <h2>En Özel Günümüze Doğru</h2>
    </div>
    <div class="countdown__grid reveal" aria-live="polite">
      <div class="countdown__item arch-tile"><span class="countdown__value" id="cd-d">--</span><span class="countdown__label">Gün</span></div>
      <div class="countdown__item arch-tile"><span class="countdown__value" id="cd-h">--</span><span class="countdown__label">Saat</span></div>
      <div class="countdown__item arch-tile"><span class="countdown__value" id="cd-m">--</span><span class="countdown__label">Dakika</span></div>
      <div class="countdown__item arch-tile"><span class="countdown__value" id="cd-s">--</span><span class="countdown__label">Saniye</span></div>
    </div>
    <p class="countdown__note reveal" data-cfg="countdownNote"></p>
  </div>
</section>

<div class="scallop" style="--target:var(--ivory);transform:rotate(180deg)"></div>

<!-- NOT + FOTOĞRAF -->
<section class="note">
  <div class="marquee reveal">
    <div class="marquee__track" id="marqueeTrack"></div>
  </div>
  <div class="wrap">
    <p class="note__text" data-cfg="note"></p>
  </div>
</section>

<div class="scallop" style="--target:var(--sand)"></div>

<!-- DETAYLAR -->
<section class="details" style="background:var(--sand)">
  <div class="wrap">
    <div class="section-head reveal">
      <p class="eyebrow">Detaylar</p>
      <h2>Bilmeniz gereken her şey</h2>
    </div>
    <div class="details__grid reveal">
      <div class="detail-card">
        <p class="eyebrow" data-cfg="ceremony.label"></p>
        <h3 data-cfg="ceremony.venue"></h3>
        <span class="detail-card__time" data-cfg="ceremony.time"></span>
        <p class="detail-card__addr" data-cfg="ceremony.address"></p>
        <a class="detail-card__link" data-cfg-href="ceremony.mapUrl" href="#" target="_blank" rel="noopener noreferrer">Yol Tarifi Al</a>
      </div>
      <div class="detail-card">
        <p class="eyebrow" data-cfg="wedding.label"></p>
        <h3 data-cfg="wedding.venue"></h3>
        <span class="detail-card__time" data-cfg="wedding.time"></span>
        <p class="detail-card__addr" data-cfg="wedding.address"></p>
        <a class="detail-card__link" data-cfg-href="wedding.mapUrl" href="#" target="_blank" rel="noopener noreferrer">Yol Tarifi Al</a>
      </div>
    </div>
  </div>
</section>

<!-- TIMELINE -->
<section class="timeline">
  <div class="wrap">
    <div class="section-head reveal">
      <p class="eyebrow">Akış</p>
      <h2>Günün planı</h2>
    </div>
    <div id="timelineWrap"></div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <p class="foot-names"><span data-cfg="partner1"></span><span class="amp">&amp;</span><span data-cfg="partner2"></span></p>
  <p class="foot-line" data-cfg="dateShort"></p>
</footer>

<script src="script.js"></script>
</body>
</html>
